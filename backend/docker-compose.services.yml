# Services for local backend development: PostgreSQL for the ZODB, the
# catalog and the Breaking News fan-out, and silo for blobs.
#
#   make services-start   # then: make create-site && make start-asgi
#
# Credentials match instance.yaml and .env.example.
name: asgi-demo-services

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: plone
      POSTGRES_PASSWORD: plone
      POSTGRES_DB: plone
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plone -d plone"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - dev-db:/var/lib/postgresql

  silo:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: silo
      MINIO_ROOT_PASSWORD: silo-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - dev-blobs:/data

  silo-init:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mc alias set local http://silo:9000 silo silo-secret &&
        mc mb --ignore-existing local/plone-blobs
    restart: "no"

volumes:
  dev-db: {}
  dev-blobs: {}
